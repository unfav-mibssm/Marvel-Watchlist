<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Watch Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="wordmark-tick"></div>
        <h1 class="wordmark">Watch Order</h1>
        <p class="subtitle">Every Marvel film and series, in sequence.</p>
      </div>
      <button id="hideWatchedBtn" class="ghost-btn" type="button" aria-pressed="false">Hide watched</button>
    </div>

    <div class="progress-row">
      <div class="progress-figure">
        <span id="progressCount">0</span><span class="progress-total">/ <span id="progressTotal">0</span> watched</span>
      </div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <nav class="section-nav" id="sectionNav" aria-label="Jump to section"></nav>
  </div>
</header>

<main id="main" class="content"></main>

<footer class="site-footer">
  <button id="resetBtn" class="text-btn" type="button">Reset all progress</button>
  <p class="footnote">Progress saves automatically in this browser, on this device.</p>
</footer>

<script src="script.js" defer></script>
</body>
</html>
