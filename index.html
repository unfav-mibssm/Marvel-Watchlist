<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t.me/MCUmoviesByMibu</title>
    <style>
        :root { --marvel-red: #e62429; --subtle-red: rgba(230, 36, 41, 0.1); --bg: #050505; --card: #121212; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 20px; line-height: 1.4; }
        .container { max-width: 1000px; margin: auto; }
        
        /* Sticky Progress Header */
        .header { 
            position: sticky; top: 0; background: rgba(5, 5, 5, 0.9); 
            backdrop-filter: blur(10px); padding: 15px 0; border-bottom: 1px solid #222; z-index: 1000; 
        }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; margin: 0; color: var(--marvel-red); }
        #stats { font-size: 1.1rem; margin-top: 5px; font-weight: 700; color: #fff; }
        .bar-bg { background: #222; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        #bar-fill { background: var(--marvel-red); height: 100%; width: 0%; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px var(--marvel-red); }

        h2 { font-size: 1.4rem; color: var(--marvel-red); margin-top: 40px; border-left: 4px solid var(--marvel-red); padding-left: 12px; text-transform: uppercase; }
        h3 { font-size: 0.9rem; color: #888; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }

        /* Movie Card Style */
        .movie-row { margin-bottom: 10px; }
        .mcu-movie { 
            background: var(--subtle-red) !important; border: 1px solid var(--marvel-red) !important; 
            padding: 15px; border-radius: 8px; font-weight: bold; display: flex; align-items: center;
        }
        .legacy-movie { 
            background: var(--card); border: 1px solid #222; padding: 12px; border-radius: 8px; 
            display: flex; align-items: center; margin-bottom: 8px;
        }

        /* Compact Episode Grid */
        .episode-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        
        .ep-chip {
            position: relative; background: #1a1a1a; border: 1px solid #333;
            border-radius: 4px; width: 45px; height: 45px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .ep-chip:hover { border-color: #555; background: #222; }
        .ep-chip input { position: absolute; opacity: 0; cursor: pointer; width: 100%; height: 100%; z-index: 2; }
        
        /* Custom Diamond Checkbox UI */
        .ep-label { font-size: 0.75rem; color: #aaa; z-index: 1; pointer-events: none; }
        .ep-chip input:checked ~ .ep-label { color: #fff; font-weight: bold; }
        .ep-chip input:checked { background: var(--marvel-red); }
        .ep-chip.checked { border-color: var(--marvel-red); background: rgba(230, 36, 41, 0.2); }
        .ep-chip.checked::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 1px solid var(--marvel-red); border-radius: 4px; box-shadow: inset 0 0 5px var(--marvel-red);
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>My Marvel Watchlist</h1>
        <div id="stats">Progress: 0 / 206 (Keep grinding!)</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <h2>Starting with</h2>
    <div class="movie-row">
        <div class="item mcu-movie">
            <input type="checkbox" id="ca_bnw" class="main-check"><label for="ca_bnw" style="margin-left:10px">Captain America: Brave New World (2025)</label>
        </div>
    </div>

    <h2>The Defenders Saga</h2>
    <div id="defenders_list"></div>

    <h2>The New Era</h2>
    <div id="born_again_s1"></div>
    <div class="movie-row">
        <div class="item mcu-movie">
            <input type="checkbox" id="tb_2025" class="main-check"><label for="tb_2025" style="margin-left:10px">Thunderbolts* (2025)</label>
        </div>
    </div>
    <div id="ironheart_s1"></div>

    <h2>Fantastic Four</h2>
    <div class="legacy-movie"><input type="checkbox" id="ff05"><label for="ff05" style="margin-left:10px">Fantastic Four (2005)</label></div>
    <div class="legacy-movie"><input type="checkbox" id="ff07"><label for="ff07" style="margin-left:10px">Fantastic Four: Rise of the Silver Surfer (2007)</label></div>
    <div class="legacy-movie"><input type="checkbox" id="ff15"><label for="ff15" style="margin-left:10px">Fantastic Four (2015)</label></div>
    <div class="mcu-movie"><input type="checkbox" id="ff25"><label for="ff25" style="margin-left:10px">The Fantastic Four: First Steps (2025)</label></div>

    <h2>and then</h2>
    <div id="specials_list"></div>
</div>

<script>
    const defendersData = [
        { id: 'dd1', name: 'Daredevil (Season 1)', count: 13 },
        { id: 'jj1', name: 'Jessica Jones (Season 1)', count: 13 },
        { id: 'dd2', name: 'Daredevil (Season 2)', count: 13 },
        { id: 'lc1', name: 'Luke Cage (Season 1)', count: 13 },
        { id: 'if1', name: 'Iron Fist (Season 1)', count: 13 },
        { id: 'def', name: 'The Defenders (season 1)', count: 8 },
        { id: 'p1', name: 'The Punisher (Season 1)', count: 13 },
        { id: 'jj2', name: 'Jessica Jones (Season 2)', count: 13 },
        { id: 'lc2', name: 'Luke Cage (Season 2)', count: 13 },
        { id: 'if2', name: 'Iron Fist (Season 2)', count: 10 },
        { id: 'dd3', name: 'Daredevil (Season 3)', count: 13 },
        { id: 'p2', name: 'The Punisher (Season 2)', count: 13 },
        { id: 'jj3', name: 'Jessica Jones (Season 3)', count: 13 }
    ];

    const modernData = [
        { id: 'ba1', name: 'Daredevil: Born Again (Season 1)', count: 9, root: 'born_again_s1' },
        { id: 'ih', name: 'Ironheart (Season 1)', count: 6, root: 'ironheart_s1' }
    ];

    const specialsData = [
        { id: 'wak', name: 'Eyes of Wakanda (Season 1)', count: 4 },
        { id: 'zom', name: 'Marvel Zombies (Season 1)', count: 4 },
        { id: 'wm', name: 'Wonder Man (Season 1)', count: 8 },
        { id: 'ba2', name: 'Daredevil: Born Again (Season 2)', count: 8 }
    ];

    function renderCompact(data, containerId) {
        const container = document.getElementById(containerId);
        data.forEach(show => {
            const h3 = document.createElement('h3'); h3.innerText = show.name;
            const grid = document.createElement('div'); grid.className = 'episode-grid';
            for (let i = 1; i <= show.count; i++) {
                const label = document.createElement('label');
                label.className = 'ep-chip';
                const id = `${show.id}_ep${i}`;
                label.innerHTML = `
                    <input type="checkbox" id="${id}">
                    <span class="ep-label">${i}</span>
                `;
                grid.appendChild(label);
            }
            container.appendChild(h3);
            container.appendChild(grid);
        });
    }

    function sync() {
        const checks = {};
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            checks[cb.id] = cb.checked;
            // Update Chip Style
            if (cb.parentNode.classList.contains('ep-chip')) {
                if (cb.checked) cb.parentNode.classList.add('checked');
                else cb.parentNode.classList.remove('checked');
            }
        });
        localStorage.setItem('marvel_compact_tracker_v1', JSON.stringify(checks));
        
        const total = document.querySelectorAll('input[type="checkbox"]').length;
        const active = document.querySelectorAll('input[type="checkbox"]:checked').length;
        document.getElementById('stats').innerText = `Progress: ${active} / ${total} (Keep grinding!)`;
        document.getElementById('bar-fill').style.width = (active / total * 100) + '%';
    }

    renderCompact(defendersData, 'defenders_list');
    modernData.forEach(item => renderCompact([item], item.root));
    renderCompact(specialsData, 'specials_list');

    const saved = JSON.parse(localStorage.getItem('marvel_compact_tracker_v1') || '{}');
    Object.keys(saved).forEach(id => { const cb = document.getElementById(id); if (cb) cb.checked = saved[id]; });
    sync();

    document.addEventListener('change', (e) => { if (e.target.type === 'checkbox') sync(); });
</script>
</body>
  </html>
